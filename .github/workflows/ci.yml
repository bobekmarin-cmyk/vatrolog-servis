name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prisma schema
        # `prisma validate` parsira schema.prisma uključujući `env("DATABASE_URL")`,
        # pa varijabla MORA postojati cak i ako se nigdje ne spaja. Dummy
        # connection string je standardni CI workaround.
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_validate?schema=public"
        run: npx prisma validate
