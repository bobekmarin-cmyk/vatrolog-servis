name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prisma schema
        # `prisma validate` parsira schema.prisma uključujući `env("DATABASE_URL")`,
        # pa varijabla MORA postojati cak i ako se nigdje ne spaja. Dummy
        # connection string je standardni CI workaround.
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_validate?schema=public"
        run: npx prisma validate

      - name: Production build
        # Lint i typecheck ne hvataju greske u prerenderu (npr. client komponenta
        # koja padne tijekom static generacije). Bez ovog koraka takav kvar se
        # otkrije tek na deployu.
        env:
          NODE_ENV: production
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_build?schema=public"
          AUTH_SECRET: "ci-build-only-secret-not-used-at-runtime"
          PLATFORM_AUTH_SECRET: "ci-build-only-platform-secret"
          OWNER_AUTH_SECRET: "ci-build-only-owner-secret"
          ENCRYPTION_KEY: "ci-build-only-encryption-key-32bytes!"
        run: npm run build
